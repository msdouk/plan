<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ENGUITRACI-Sarl · Plan de situation</title>
<meta name="description" content="Retrouvez votre parcelle sur le plan d’aménagement ENGUITRACI-Sarl.">
<meta name="theme-color" content="#009038">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="ol.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:#e5e7eb}
#map{position:absolute;inset:0}
.top{position:absolute;left:0;right:0;top:0;z-index:5;background:#2f3133;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top img{height:36px;background:#fff;border-radius:6px;padding:2px}
.top b{display:block;font-size:15px;letter-spacing:.3px}.top span{font-size:11.5px;opacity:.85}
.band{position:absolute;left:0;right:0;height:4px;bottom:-4px;background:linear-gradient(90deg,#ce1126 0 33.34%,#fcd116 33.34% 66.67%,#009460 66.67% 100%)}
.search{position:absolute;z-index:5;top:66px;left:10px;right:10px;max-width:460px;display:flex;gap:6px}
.search input,.search select{height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:0 10px;font-size:15px;background:#fff;min-width:0}
.search input{flex:1}.search select{max-width:38%}
.search button{height:42px;border:0;border-radius:10px;padding:0 14px;background:#009038;color:#fff;font-weight:700;font-size:15px}
.tools{position:absolute;z-index:5;right:10px;top:118px;display:flex;flex-direction:column;gap:6px}
.tools button{width:44px;height:44px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tools button.on{background:#009038;color:#fff;border-color:#007a2f}
.card{position:absolute;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:460px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;display:none}
.card.on{display:block}
.card h2{margin:0 0 2px;font-size:18px}.card .sub{color:#475569;font-size:13px;margin-bottom:8px}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin-bottom:10px}.card .kv span{color:#64748b}
.card .btns{display:flex;gap:6px;flex-wrap:wrap}
.card a,.card button{flex:1;min-width:120px;height:42px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:#0f172a;text-decoration:none}
.card a.go{background:#009038;border-color:#007a2f;color:#fff}
.card .x{position:absolute;right:8px;top:6px;flex:none;min-width:0;width:34px;height:34px;border:0;font-size:20px;color:#64748b}
.card .cli{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px 10px;margin:0 0 10px}
.card .cli small{display:block;color:#15803d;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.card .cli b.nm{display:block;font-size:16px;margin:1px 0 5px}
.card .cli .hd{display:flex;gap:10px;align-items:center}.card .cli .hd img{width:58px;height:58px;border-radius:10px;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);flex:none}
.card .cli .kv{margin:0}.card .cli em{display:block;font-style:normal;color:#64748b;font-size:11.5px;margin-top:5px}
.card .cli.bad{background:#fef2f2;border-color:#fecaca}.card .cli.bad small{color:#b91c1c}
.ok{color:#15803d}.due{color:#b45309}
.msg{position:absolute;z-index:7;left:50%;top:120px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 14px;border-radius:10px;font-size:13.5px;display:none;max-width:90%}
.foot{position:absolute;z-index:4;left:10px;bottom:4px;font-size:10.5px;color:#334155;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:6px}
.card.on ~ .foot{display:none}
@media(min-width:700px){.card{left:auto;right:12px;bottom:12px;width:400px}.search{right:auto;width:460px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><img src="logo.png" alt="ENGUITRACI-Sarl"><div><b>ENGUITRACI-SARL</b><span>Plan de situation des parcelles</span></div><div class="band"></div></div>
<form class="search" id="sf" autocomplete="off">
  <select id="sp" aria-label="Plan d’aménagement"></select>
  <input id="sq" placeholder="Lot et n° (ex. 13 4)" inputmode="search" aria-label="Lot et numéro">
  <button type="submit">Chercher</button>
</form>
<div class="tools">
  <button type="button" id="b-sat" title="Vue satellite">🛰</button>
  <button type="button" id="b-gps" title="Ma position">◎</button>
  <button type="button" id="b-all" title="Tout le plan">⤢</button>
</div>
<div class="msg" id="msg"></div>
<div class="card" id="card"></div>
<div class="foot">© ENGUITRACI-Sarl · plan indicatif · fonds © OpenStreetMap, Esri</div>
<script src="ol.js"></script>
<script src="plans.js"></script>
<script>
(function () {
  'use strict';
  var P = window.EGT_PLANS || [], fmt = new ol.format.GeoJSON();
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var NF = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
  function msg(t, ms) { var m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(function () { m.style.display = 'none'; }, ms || 3500); }

  /* fonds de carte */
  var osm = new ol.layer.Tile({source: new ol.source.OSM(), visible: true});
  var sat = new ol.layer.Tile({source: new ol.source.XYZ({url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attributions: 'Esri'}), visible: false});

  /* parcelles, dessin, textes */
  var parcels = new ol.source.Vector(), lines = new ol.source.Vector(), labels = new ol.source.Vector(), byId = {};
  P.forEach(function (pl) {
    var fs = fmt.readFeatures(pl.parcels, {dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857'});
    fs.forEach(function (f) { f.set('plan', pl); byId[f.get('id')] = f; if (f.get('p')) f.set('pt', ol.proj.fromLonLat(f.get('p'))); });
    parcels.addFeatures(fs);
    if (pl.lines) lines.addFeatures(fmt.readFeatures(pl.lines, {dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857'}));
    (pl.labels || []).forEach(function (L) { var f = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat(L.c))); f.setProperties({t: L.t, k: L.k, r: L.r || 0, h: L.h || 4}); labels.addFeature(f); });
  });
  /* informations du bénéficiaire transmises dans le lien (#p=…&c=données.signature), signées par ENGUITRACI-Sarl */
  var PUBKEY = {"kty": "EC", "crv": "P-256", "x": "QjWOFdHp474P1j0ho0N_PIm64A7IRK2W2vgc9qcGtAs", "y": "IUxf-YqCK6nLHRG2dy8lPz0R9Bqfel3tJ41-9sNLopg"}, CLI = null;
  function b64uDec(t) { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var s = atob(t), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  function readClient(c) {
    var m = /^([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(c || '');
    if (!m) return Promise.resolve(null);
    if (!window.crypto || !crypto.subtle) return Promise.resolve({bad: true});
    return crypto.subtle.importKey('jwk', PUBKEY, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']).then(function (k) {
      return crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, k, b64uDec(m[2]), new TextEncoder().encode(m[1]));
    }).then(function (ok) { return ok ? JSON.parse(new TextDecoder().decode(b64uDec(m[1]))) : {bad: true}; }, function () { return {bad: true}; });
  }
  /* photo jointe au lien : acceptée seulement si son empreinte correspond à celle signée */
  function readPhoto(o, f64) {
    if (!o || o.bad || !o.h || !f64) return Promise.resolve(o);
    var b; try { b = b64uDec(f64); } catch (e) { return Promise.resolve(o); }
    return crypto.subtle.digest('SHA-256', b).then(function (h) {
      var s = '', u = new Uint8Array(h); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
      if (btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '').slice(0, 22) === o.h) o.photo = URL.createObjectURL(new Blob([b], {type: 'image/jpeg'}));
      return o;
    }, function () { return o; });
  }
  function fdate(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : (d || ''); }
  function clientHtml(f) {
    if (!CLI || (!CLI.bad && CLI.i !== f.get('id'))) return '';
    if (CLI.bad) return '<div class="cli bad"><small>Informations non vérifiées</small>Ce lien a été modifié ou n’a pas été émis par ENGUITRACI-Sarl : les informations du bénéficiaire ne sont pas affichées.</div>';
    var A = CLI.a, C = CLI.c;
    return '<div class="cli"><div class="hd">' + (CLI.photo ? '<img src="' + CLI.photo + '" alt="Photo du bénéficiaire">' : '') + '<div><small>Bénéficiaire</small><b class="nm">' + esc(CLI.b) + '</b></div></div><div class="kv">' +
      (CLI.d ? '<span>Attribuée le</span><b>' + esc(fdate(CLI.d)) + (CLI.m ? ' · ' + esc(String(CLI.m).toLowerCase()) : '') + '</b>' : '') +
      (A ? '<span>' + (A[0] === 'T' ? 'Transfert' : 'Attestation') + '</span><b>N° ' + esc(A[1]) + (A[2] ? ' du ' + esc(fdate(A[2])) : '') + '</b>' : '') +
      (CLI.s != null ? '<span>Paiement</span><b class="' + (CLI.s ? 'ok' : 'due') + '">' + (CLI.s ? 'Soldé' : 'En cours') + '</b>' : '') +
      (C ? '<span>Certificat</span><b>' + esc(C[0]) + (C[1] ? ' du ' + esc(fdate(C[1])) : '') + '</b>' : '') +
      '</div><em>✓ Informations certifiées par ENGUITRACI-Sarl au ' + esc(fdate(CLI.t)) + '. Seule l’attestation originale fait foi.</em></div>';
  }
  var sel = null;
  var FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  var cache = {};
  function pStyle(f, res) {
    var eq = f.get('t') === 'e', me = f === sel, w = res > 2 ? 0.6 : res > 0.6 ? 1 : 1.4;
    var k = (eq ? 'e' : 'p') + (me ? 's' : '') + w;
    var st = cache[k] || (cache[k] = new ol.style.Style({
      fill: new ol.style.Fill({color: me ? 'rgba(220,38,38,.55)' : eq ? 'rgba(147,197,253,.75)' : 'rgba(167,217,138,.6)'}),
      stroke: new ol.style.Stroke({color: me ? '#b91c1c' : eq ? '#1d4ed8' : '#3f6b2a', width: me ? 3 : eq ? w * 1.6 : w})}));
    var out = [st];
    var txt = eq ? f.get('e') : f.get('n'), at = f.get('pt');
    if (txt && res < (eq ? 1.4 : 0.55)) {
      out.push(new ol.style.Style({geometry: at ? new ol.geom.Point(at) : function (ff) { var g = ff.getGeometry(); return g.getType() === 'MultiPolygon' ? g.getInteriorPoints() : g.getInteriorPoint(); },
        text: new ol.style.Text({text: eq ? String(txt).toUpperCase() : String(txt), font: (eq ? '800 ' : '700 ') + (eq ? 11 : Math.max(10, Math.min(18, 3.6 / res))).toFixed(1) + 'px ' + FONT,
          fill: new ol.style.Fill({color: me ? '#7f1d1d' : eq ? '#1e3a8a' : '#111827'}), stroke: new ol.style.Stroke({color: '#fff', width: 3}), overflow: eq})}));
    }
    return out;
  }
  var LS = {ilot: new ol.style.Style({stroke: new ol.style.Stroke({color: '#7f1d1d', width: 1.6})}), equip: new ol.style.Style({stroke: new ol.style.Stroke({color: '#1d4ed8', width: 1.6, lineDash: [6, 3]})})};
  function lStyle(f) { return LS[f.get('k')] || LS.ilot; }
  function tStyle(f, res) {
    var k = f.get('k'), px = f.get('h') / res;
    if (k === 'lot') px = Math.min(Math.max(px, 12), 30); else { if (px < 6) return null; px = Math.min(Math.max(px, 9), 18); }
    if (k === 'lot' && res > 3) return null;
    return new ol.style.Style({text: new ol.style.Text({text: k === 'lot' ? String(f.get('t')).toUpperCase() : f.get('t'), rotation: f.get('r'), rotateWithView: true, overflow: true,
      font: (k === 'lot' ? '800 ' : 'italic 600 ') + px.toFixed(1) + 'px ' + FONT, fill: new ol.style.Fill({color: k === 'lot' ? '#7f1d1d' : '#475569'}), stroke: new ol.style.Stroke({color: 'rgba(255,255,255,.95)', width: k === 'lot' ? 4 : 3})})});
  }
  var pLayer = new ol.layer.Vector({source: parcels, style: pStyle, updateWhileInteracting: true});
  var map = new ol.Map({target: 'map', layers: [osm, sat, pLayer, new ol.layer.Vector({source: lines, style: lStyle}), new ol.layer.Vector({source: labels, style: tStyle, declutter: true})],
    view: new ol.View({center: ol.proj.fromLonLat([-13.6, 9.6]), zoom: 13, maxZoom: 21}), controls: (function () { var d = ol.control.defaults; d = typeof d === 'function' ? d : d && d.defaults; return d ? d({attribution: false, rotate: false}) : undefined; })()});
  var me = new ol.source.Vector();
  map.addLayer(new ol.layer.Vector({source: me, style: new ol.style.Style({image: new ol.style.Circle({radius: 8, fill: new ol.style.Fill({color: '#2563eb'}), stroke: new ol.style.Stroke({color: '#fff', width: 3})})})}));

  function fitAll() { var e = parcels.getExtent(); if (e && isFinite(e[0])) map.getView().fit(e, {padding: [120, 20, 40, 20], duration: 300}); }
  function lonlatOf(f) { var g = f.getGeometry(), c = g.getType() === 'MultiPolygon' ? g.getInteriorPoints().getCoordinates()[0] : g.getInteriorPoint().getCoordinates(); return ol.proj.toLonLat(c); }
  function show(f, zoom) {
    sel = f; cache = {}; pLayer.changed();
    var pl = f.get('plan'), eq = f.get('t') === 'e', ll = lonlatOf(f), gm = 'https://www.google.com/maps/dir/?api=1&destination=' + ll[1].toFixed(6) + ',' + ll[0].toFixed(6);
    var title = eq ? f.get('e') || 'Équipement' : 'Parcelle n° ' + (f.get('n') || '—');
    $('#card').innerHTML = '<button class="x" type="button" aria-label="Fermer">×</button><h2>' + esc(title) + '</h2><div class="sub">Plan d’aménagement de ' + esc(pl.name) + (f.get('l') ? ' · Lot ' + esc(f.get('l')) : '') + '</div>' +
      clientHtml(f) + '<div class="kv">' + (f.get('l') ? '<span>Lot</span><b>' + esc(f.get('l')) + '</b>' : '') + (!eq ? '<span>Parcelle</span><b>n° ' + esc(f.get('n') || '—') + '</b>' : '') +
      (f.get('s') ? '<span>Superficie</span><b>' + NF.format(f.get('s')) + ' m² (indicative)</b>' : '') + '<span>GPS</span><b>' + ll[1].toFixed(6) + ', ' + ll[0].toFixed(6) + '</b></div>' +
      '<div class="btns"><a class="go" href="' + gm + '" target="_blank" rel="noopener">➜ M’y rendre</a><button type="button" id="b-share">Partager</button></div>';
    $('#card').classList.add('on');
    $('#card .x').onclick = function () { $('#card').classList.remove('on'); sel = null; pLayer.changed(); };
    $('#b-share').onclick = function () {
      var url = location.href.split('#')[0] + '#p=' + encodeURIComponent(f.get('id'));
      if (navigator.share) navigator.share({title: 'Ma parcelle — ENGUITRACI-Sarl', text: title + ' · ' + pl.name, url: url}).catch(function () {});
      else { try { navigator.clipboard.writeText(url); msg('Lien copié.'); } catch (e) { prompt('Lien de la parcelle :', url); } }
    };
    if (zoom !== false) map.getView().fit(f.getGeometry().getExtent(), {padding: [150, 60, 260, 60], maxZoom: 19, duration: 500});
    var hm = /[#&]p=([^&]+)/.exec(location.hash);
    if (!hm || decodeURIComponent(hm[1]) !== f.get('id')) history.replaceState(null, '', '#p=' + encodeURIComponent(f.get('id')));
  }
  map.on('singleclick', function (e) {
    var f = map.forEachFeatureAtPixel(e.pixel, function (x) { return parcels.hasFeature(x) ? x : null; }, {hitTolerance: 2});
    if (f) show(f, false);
  });

  /* recherche : « 13 4 », « lot 13 n 4 », « 4 » */
  $('#sp').innerHTML = '<option value="">Tous les plans</option>' + P.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
  $('#sf').onsubmit = function (e) {
    e.preventDefault();
    var q = $('#sq').value.toUpperCase().replace(/LOT|PARCELLE|N°|NO\b|N\b/g, ' ').trim().split(/[\s,;\/\-]+/).filter(Boolean), pid = $('#sp').value;
    if (!q.length) return;
    var lot = q.length > 1 ? q[0] : '', n = q[q.length - 1], hits = [];
    parcels.getFeatures().forEach(function (f) {
      if (pid && f.get('plan').id !== pid) return;
      var fn = String(f.get('n') || '').toUpperCase(), fl = String(f.get('l') || '').toUpperCase();
      if (fn === n && (!lot || fl === lot)) hits.push(f);
      else if (f.get('t') === 'e' && String(f.get('e') || '').toUpperCase().indexOf(q.join(' ')) >= 0) hits.push(f);
    });
    if (!hits.length) { msg('Aucune parcelle trouvée' + (lot ? ' (lot ' + lot + ', n° ' + n + ')' : ' (n° ' + n + ')') + '.'); return; }
    if (hits.length > 1) msg(hits.length + ' parcelles portent ce numéro : précisez le lot (ex. « 13 ' + n + ' »).', 5000);
    show(hits[0]); $('#sq').blur();
  };

  /* outils */
  $('#b-sat').onclick = function () { var on = !sat.getVisible(); sat.setVisible(on); osm.setVisible(!on); this.classList.toggle('on', on); };
  $('#b-all').onclick = fitAll;
  $('#b-gps').onclick = function () {
    if (!navigator.geolocation) { msg('Position non disponible sur cet appareil.'); return; }
    var b = this; b.classList.add('on'); msg('Recherche de votre position…', 2500);
    navigator.geolocation.getCurrentPosition(function (p) {
      var c = ol.proj.fromLonLat([p.coords.longitude, p.coords.latitude]); me.clear(); me.addFeature(new ol.Feature(new ol.geom.Point(c)));
      map.getView().animate({center: c, zoom: Math.max(map.getView().getZoom(), 17), duration: 500});
    }, function () { b.classList.remove('on'); msg('Position refusée ou indisponible.'); }, {enableHighAccuracy: true, timeout: 15000});
  };

  /* lien direct : #p=<identifiant de la parcelle> */
  function fromHash() {
    var m = /[#&]p=([^&]+)/.exec(location.hash), f = m && byId[decodeURIComponent(m[1])], c = /[#&]c=([^&]+)/.exec(location.hash);
    var ph = /[#&]f=([^&]+)/.exec(location.hash);
    if (f && c) { readClient(c[1]).then(function (o) { return readPhoto(o, ph && ph[1]); }).then(function (o) { CLI = o; show(f); }); return; }
    if (f) show(f); else { fitAll(); if (m) msg('Parcelle introuvable sur le plan publié : contactez ENGUITRACI-Sarl.', 6000); }
  }
  window.addEventListener('hashchange', fromHash);
  if (!P.length) msg('Aucun plan publié.', 8000);
  fromHash();
})();
</script>
</body>
</html>
